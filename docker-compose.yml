version: '3.8'

services:
  web:
    build: .
    container_name: estateiq_web
    restart: always
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-estateiq-prod-secret-key-change-in-env}
      - DATABASE_URL=postgresql://estateiq_user:estateiq_secure_pass@db:5432/estateiq_db
      - REDIS_URL=redis://redis:6379/0
      - ADS_ENABLED=${ADS_ENABLED:-false}
      - ADSENSE_CLIENT_ID=${ADSENSE_CLIENT_ID:-}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-}
    depends_on:
      - db
      - redis
    ports:
      - "5000:5000"
    volumes:
      - ./app/static/uploads:/app/app/static/uploads

  db:
    image: postgis/postgis:16-3.4
    container_name: estateiq_db
    restart: always
    environment:
      - POSTGRES_USER=estateiq_user
      - POSTGRES_PASSWORD=estateiq_secure_pass
      - POSTGRES_DB=estateiq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: estateiq_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nginx:
    image: nginx:alpine
    container_name: estateiq_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/usr/share/nginx/html/static:ro
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
